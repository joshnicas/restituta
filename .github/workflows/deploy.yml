name: Deploy to Cloud Run

on:
  push:
    branches: [backend, main]
  workflow_dispatch:

env:
  PROJECT_ID: kido-2026
  REGION: africa-south1
  AR_REPO: kido
  SERVICE: kido-api
  IMAGE: africa-south1-docker.pkg.dev/kido-2026/kido/kido-api

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Check if deploy is requested
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual run — deploying."
          elif echo "${{ github.event.head_commit.message }}" | grep -q '\[DEPLOY\]'; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "[DEPLOY] found in commit message — deploying."
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "No [DEPLOY] in commit message — skipping deploy."
          fi

  build-and-deploy:
    needs: check-trigger
    if: needs.check-trigger.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Run Prisma migrations
        run: |
          docker run --rm \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            ${{ env.IMAGE }}:${{ github.sha }} \
            npx prisma migrate deploy

      - name: Generate Cloud Run env vars file
        env:
          ALL_SECRETS: ${{ toJson(secrets) }}
        run: |
          echo "$ALL_SECRETS" | jq -r '
            to_entries[]
            | select(.key | test("^(GCP_SA_KEY|GHCR_PAT|PORT|SERVER_|SSH_)") | not)
            | "\(.key): \(.value | @json)"
          ' > env.yaml

          echo 'NODE_ENV: "production"' >> env.yaml

          echo "Cloud Run env keys that will be set:"
          cut -d: -f1 env.yaml | sort

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --service-account=cloud-run-runtime@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --env-vars-file=env.yaml \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --timeout=300 \
            --quiet