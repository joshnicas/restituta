name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - mobile

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production API URL
        env:
          EXPO_PUBLIC_API_BASE: ${{ vars.EXPO_PUBLIC_API_BASE }}
        run: |
          if [ -z "$EXPO_PUBLIC_API_BASE" ]; then
            echo "::error::EXPO_PUBLIC_API_BASE is missing from GitHub Actions Variables."
            exit 1
          fi

          case "$EXPO_PUBLIC_API_BASE" in
            https://*) echo "Production API URL is configured." ;;
            *)
              echo "::error::EXPO_PUBLIC_API_BASE must use HTTPS."
              exit 1
              ;;
          esac

      - name: Build Expo web
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_BASE: ${{ vars.EXPO_PUBLIC_API_BASE }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KIDO_E895F }}
          channelId: live
          projectId: kido-e895f

