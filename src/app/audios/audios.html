<main class="dashboard">
  <header class="page-header">
    <div>
      <p class="eyebrow">{{ t('assets.audio.title') }}</p>
      <h1>{{ t('assets.audio.heading') }}</h1>
      <p class="intro">{{ t('assets.audio.intro') }}</p>
    </div>
  </header>

  <section class="dashboard-content" aria-label="Audios management">
    <div *ngIf="loading || categoriesLoading" class="loading">{{ t('assets.audio.loading') }}</div>
    <div *ngIf="error" class="error">{{ error }}</div>

    <ng-container *ngIf="!loading && !categoriesLoading && !error">
      <div class="actions-bar">
        <div class="filter-section">
          <label for="audio-category-filter" class="filter-label">{{ t('assets.audio.filter') }}</label>
          <select
            id="audio-category-filter"
            class="filter-dropdown"
            [(ngModel)]="selectedCategoryId"
            (ngModelChange)="onCategoryChange($event)"
          >
            <option [ngValue]="'all'">{{ t('assets.audio.all') }}</option>
            <option *ngFor="let category of categories; trackBy: trackByCategoryId" [ngValue]="category.id.toString()">
              {{ category.name }}
            </option>
          </select>
        </div>
        <button class="add-button" (click)="toggleAddForm()">
          <span class="add-icon">+</span> {{ t('assets.audio.add') }}
        </button>
      </div>

      <div class="add-form-container" *ngIf="showAddForm">
        <div class="add-form">
          <h2>{{ t('assets.audio.addNew') }}</h2>
          <div class="form-group">
            <label for="audio-name">{{ t('assets.audio.name') }}</label>
            <input id="audio-name" type="text" class="form-input" [(ngModel)]="newAudio.name" [placeholder]="t('assets.audio.placeholder.name')" />
          </div>
          <div class="form-group">
            <label for="audio-category">{{ t('assets.audio.category') }}</label>
            <select id="audio-category" class="form-input" [(ngModel)]="newAudio.audioCategoryId">
              <option value="" disabled>{{ t('assets.audio.placeholder.category') }}</option>
              <option *ngFor="let category of categories; trackBy: trackByCategoryId" [ngValue]="category.id">{{ category.name }}</option>
            </select>
          </div>
          <div class="form-group">
            <label for="audio-file">{{ t('assets.audio.file') }}</label>
            <input id="audio-file" type="file" class="form-input" accept="audio/*" (change)="onFileSelected($event)" />
          </div>
          <div class="form-actions">
            <button class="submit-button" (click)="addAudio()" [disabled]="submitting">
              {{ submitting ? t('assets.audio.uploading') : t('assets.audio.add') }}
            </button>
            <button class="cancel-button" (click)="toggleAddForm()">{{ t('assets.audio.cancel') }}</button>
          </div>
        </div>
      </div>

      <div class="audios-grid" *ngIf="filteredAudios.length > 0">
        <article class="audio-card" *ngFor="let audio of filteredAudios; trackBy: trackByAudioId">
          <div class="audio-preview">
            <audio *ngIf="getAudioSrc(audio)" [src]="getAudioSrc(audio)" controls></audio>
            <div *ngIf="!getAudioSrc(audio)" class="empty-preview">{{ t('assets.audio.noUrl') }}</div>
          </div>
          <div class="audio-info">
            <h3 class="audio-name">{{ audio.name }}</h3>
            <span class="audio-type">{{ getCategoryName(audio) }}</span>
          </div>
          <button class="delete-button" (click)="deleteAudio(audio.id)" aria-label="Delete audio">×</button>
        </article>
      </div>

      <p *ngIf="filteredAudios.length === 0" class="empty-state">{{ t('assets.audio.empty') }}</p>
    </ng-container>
  </section>
</main>
