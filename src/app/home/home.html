<main class="dashboard">
  <header class="page-header">
    <div>
      <p class="eyebrow">{{ t('home.overview') }}</p>
      <h1>{{ t('home.dashboard') }}</h1>
      <p class="intro">{{ t('home.intro') }}</p>
    </div>
    <a class="primary-action" [routerLink]="['/questions/add']">{{ t('home.addQuestion') }}</a>
  </header>

  <section class="dashboard-content" aria-label="Dashboard summary">
    <app-stat-card [users]="stats.users" [subjects]="stats.subjects" [questions]="stats.questions" [images]="stats.images" [audios]="stats.audios" />
  </section>
</main>
