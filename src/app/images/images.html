<main class="dashboard">
  <header class="page-header">
    <div>
      <p class="eyebrow">{{ t('assets.images.title') }}</p>
      <h1>{{ t('assets.images.heading') }}</h1>
      <p class="intro">{{ t('assets.images.intro') }}</p>
    </div>
  </header>

  <section class="dashboard-content" aria-label="Images management">
    <div *ngIf="loading || categoriesLoading" class="loading">{{ t('assets.images.loading') }}</div>
    <div *ngIf="error" class="error">{{ error }}</div>

    <ng-container *ngIf="!loading && !categoriesLoading && !error">
      <div class="actions-bar">
        <div class="filter-section">
          <label for="image-category-filter" class="filter-label">{{ t('assets.images.filter') }}</label>
          <select
            id="image-category-filter"
            class="filter-dropdown"
            [(ngModel)]="selectedCategoryId"
            (ngModelChange)="onCategoryChange($event)"
          >
            <option [ngValue]="'all'">{{ t('assets.images.all') }}</option>
            <option *ngFor="let category of categories; trackBy: trackByCategoryId" [ngValue]="category.id.toString()">
              {{ category.name }}
            </option>
          </select>
        </div>
        <button class="add-button" (click)="toggleAddForm()">
          <span class="add-icon">+</span> {{ t('assets.images.add') }}
        </button>
      </div>

      <div class="add-form-container" *ngIf="showAddForm">
        <div class="add-form">
          <h2>{{ t('assets.images.addNew') }}</h2>
          <div class="form-group">
            <label for="image-name">{{ t('assets.images.name') }}</label>
            <input id="image-name" type="text" class="form-input" [(ngModel)]="newImage.name" [placeholder]="t('assets.images.placeholder.name')" />
          </div>
          <div class="form-group">
            <label for="image-category">{{ t('assets.images.category') }}</label>
            <select id="image-category" class="form-input" [(ngModel)]="newImage.imageCategoryId">
              <option value="" disabled>{{ t('assets.images.placeholder.category') }}</option>
              <option *ngFor="let category of categories; trackBy: trackByCategoryId" [ngValue]="category.id">{{ category.name }}</option>
            </select>
          </div>
          <div class="form-group">
            <label for="image-file">{{ t('assets.images.file') }}</label>
            <input id="image-file" type="file" class="form-input" accept="image/*" (change)="onFileSelected($event)" />
          </div>
          <div class="form-actions">
            <button class="submit-button" (click)="addImage()" [disabled]="submitting">
              {{ submitting ? t('assets.images.uploading') : t('assets.images.add') }}
            </button>
            <button class="cancel-button" (click)="toggleAddForm()">{{ t('assets.images.cancel') }}</button>
          </div>
        </div>
      </div>

      <div class="images-grid" *ngIf="filteredImages.length > 0">
        <article class="image-card" *ngFor="let image of filteredImages; trackBy: trackByImageId">
          <div class="image-preview">
            <img *ngIf="getImageSrc(image)" [src]="getImageSrc(image)" [alt]="image.name" />
            <div *ngIf="!getImageSrc(image)" class="empty-preview">{{ t('assets.images.noUrl') }}</div>
          </div>
          <div class="image-info">
            <h3 class="image-name">{{ image.name }}</h3>
            <span class="image-type">{{ getCategoryName(image) }}</span>
          </div>
          <button class="delete-button" (click)="deleteImage(image.id)" aria-label="Delete image">×</button>
        </article>
      </div>

      <p *ngIf="filteredImages.length === 0" class="empty-state">{{ t('assets.images.empty') }}</p>
    </ng-container>
  </section>
</main>
